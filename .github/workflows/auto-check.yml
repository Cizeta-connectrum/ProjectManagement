name: Auto Market Check

on:
  schedule:
    # 5分おきを指定しているが、GitHub Actionsの実際の発火間隔は保証されない
    # (高負荷時は数十分〜1時間以上ずれることがある)。スクリプト側は壁時計の
    # 分ではなく「前回の本チェックからの経過時間」で判定するため、実際の
    # 発火がどれだけずれても取りこぼさない。
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run market check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
        run: node scripts/auto-check.mjs

      - name: Commit updated position state
        if: always()
        run: |
          if ! git diff --quiet -- data/open-positions.json data/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/open-positions.json data/state.json
            git commit -m "chore: update run state [skip ci]"
            git push
          else
            echo "変更なし"
          fi
