name: Auto Market Check

on:
  schedule:
    # 24時間・5分おきに実行。
    # ポジション保有中の銘柄はスクリプト側で毎回(5分おき)状況判断し、
    # 保有していない銘柄は:00/:30のティックのみ通常の分析(価格記録は24時間、
    # Claude分析は日本時間9:00〜翌1:00のみ)を行う。それ以外は即スキップする。
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run market check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
        run: node scripts/auto-check.mjs

      - name: Commit updated position state
        run: |
          if ! git diff --quiet -- data/open-positions.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/open-positions.json
            git commit -m "chore: update open positions state [skip ci]"
            git push
          else
            echo "変更なし"
          fi
