name: Auto Market Check

on:
  schedule:
    # 24時間・30分おきに実行。価格データの記録は24時間行い、
    # Claude分析とDiscord通知は日本時間9:00〜翌1:00のみ
    # (スクリプト側 isTradingHours() で判定)行う。
    - cron: '0,30 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run market check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
        run: node scripts/auto-check.mjs
